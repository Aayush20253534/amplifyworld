name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages and apps
        run: pnpm build
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Install browser for Contact checks
        run: pnpm --filter @amplifyworld/web exec playwright install --with-deps chromium
      - name: Browser accessibility and interaction tests
        run: pnpm --filter @amplifyworld/web test:browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact-browser-evidence
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 14
